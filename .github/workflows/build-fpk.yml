name: Build fnOS FPK

on:
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Compile Go binary (x86_64)
        run: |
          mkdir -p deploy/fnos/app/bin
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -o deploy/fnos/app/bin/wxbackup ./cmd/server

      - name: Download and setup fnpack
        run: |
          # 更新为飞牛静态资源服务器的有效地址，并直接重命名为 fnpack
          wget -O fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack
          fnpack --help

      - name: Build FPK
        run: |
          chmod +x deploy/fnos/cmd/* deploy/fnos/app/ui/index.cgi || true
          fnpack build --directory deploy/fnos

      - name: Upload FPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wxbackup-fpk
          path: "*.fpk"
